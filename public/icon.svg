<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512">
  <!-- Bamboo Fire favicon mark — designed for legibility down to 16x16. The watercolor
       wordmark logo doesn't read at small sizes, so we use a glyph mark: bamboo-green
       circle, cream-white serif B, chili-red dot in the upper right standing in for the
       chili-pepper element of the master logo. -->
  <circle cx="32" cy="32" r="32" fill="#69933a"/>
  <text x="32" y="46" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="40" font-weight="700" fill="#fafaf7">B</text>
  <circle cx="50" cy="14" r="6" fill="#d32e1b"/>
</svg>
